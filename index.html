<!-- Define o documento como HTML5 / Defines document as HTML5 -->
<!DOCTYPE html> 

<!-- Tag raiz e idioma principal / Root tag and main language -->
<html lang="pt-BR">

  <!-- Configurações ocultas da página / Hidden page settings -->
  <head>       
      <!-- Suporte a acentos e caracteres especiais / Special characters support -->
      <meta charset="UTF-8">

      <!-- Nome que aparece na aba do navegador / Name displayed on browser tab -->
      <title>Meu Linktree</title>

      <!-- Conecta o arquivo CSS externo / Connects the external CSS file -->
      <link rel="stylesheet" href="style.css">

      <!-- IMPORTA A BIBLIOTECA DE ÍCONES -->
      <script src="https://unpkg.com/@phosphor-icons/web"></script>

  </head>

  <!-- Todo o conteúdo visível do site / All visible content of the website -->
  <body> 

      <!-- Cabeçalho semântico / Semantic header -->
      <header>
          <!-- Imagem: src = caminho do arquivo, alt = texto alternativo / Image source and alt text -->
          <img src="profileImage.JPEG" alt="Foto de perfil do Rodrigo"> 

          <!-- Título principal (Apenas um por página) / Main heading (Only one per page) -->
          <h1>Rodrigo Adonias Salgado</h1>
          
          <!-- Parágrafo de texto comum / Standard text paragraph -->
          <p>Desenvolvedor Front-End em formação</p>
      </header>

      <!-- Container do conteúdo principal / Main content container -->
      <main>
          <!-- Links transformados em botões no CSS / Links turned into buttons in CSS -->
          <a href="https://www.linkedin.com/in/rodrigo-adonias-salgado-774641288/"><i class="ph ph-linkedin-logo"></i>LinkedIn</a>
          <a href="https://github.com/RodrigoAdoniasSalgado"><i class="ph ph-github-logo"></i>GitHub</a>
          <a href="https://www.instagram.com/rodrigoadonias_/"><i class="ph ph-instagram-logo"></i>Instagram Pessoal</a>
      </main>

  </body>
</html>
